name: Detect stale catalog
on:
  schedule:
    - cron: '47 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('data/catalog.json','utf8'));
            const stamp = Date.parse(data.updated_at || '');
            const stale = !Number.isFinite(stamp) || Date.now()-stamp > 36*60*60*1000;
            const title = '[monitor] Catalog has missed its daily update';
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo,state:'open',creator:'github-actions[bot]',per_page:100});
            const existing = issues.find(i=>i.title===title);
            if(stale && !existing) await github.rest.issues.create({...context.repo,title,body:'The last successful collection is older than 36 hours. Check Actions schedules, repository activity, source access and workflow permissions. GitHub may delay scheduled runs and disables public-repository schedules after 60 days without repository activity.'});
            if(!stale && existing) await github.rest.issues.update({...context.repo,issue_number:existing.number,state:'closed'});
            // Use the same policy-v2 and 48h criterion as the public frontend.
            const {opportunityCounts} = await import(require('url').pathToFileURL(require('path').resolve('src/logic.js')).href);
            const counts = opportunityCounts(Array.isArray(data.jobs) ? data.jobs : []);
            const zeroVerified = counts.verifiedInternships === 0;
            const zeroTitle = '[monitor] Zero currently verified HR internships';
            const zeroIssue = issues.find(i=>i.title===zeroTitle);
            const zeroBody = `Verified HR internships: ${counts.verifiedInternships}; archived records: ${Array.isArray(data.jobs) ? data.jobs.length : 'unavailable'}. Last published: ${data.updated_at || 'unknown'}. Policy v2 requires a matching current official application route with verification no older than 48h. Check the scheduled collection, publication and deployment. Do NOT promote historical/unverified listings. [Monitor run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            if(zeroVerified && !zeroIssue) await github.rest.issues.create({...context.repo,title:zeroTitle,body:zeroBody});
            if(zeroVerified && zeroIssue) await github.rest.issues.update({...context.repo,issue_number:zeroIssue.number,body:zeroBody});
            if(!zeroVerified && zeroIssue) await github.rest.issues.update({...context.repo,issue_number:zeroIssue.number,state:'closed'});
            core.summary.addHeading('Catalog freshness').addRaw(`Last successful collection: ${data.updated_at || 'never'}. Status: ${stale ? 'STALE' : 'fresh'}. Verified HR internships: ${counts.verifiedInternships}. Zero-verified alert: ${zeroVerified ? 'ACTIVE' : 'clear'}.`).write();
