name: One-off Jobandtalent licensed JobTech two-cycle verification
# This workflow exists on a disposable pilot branch only.
# A creation push triggers exactly one explicitly requested, bounded run.
on:
  push:
    branches: [pilot/jobandtalent-live-20261117]
    paths:
      - '.github/workflows/jobandtalent-oneoff-20261117.yml'
permissions:
  contents: read
concurrency:
  group: oneoff-jobandtalent-live-20261117
  cancel-in-progress: false
jobs:
  one-company-two-cycles:
    if: "${{ github.event.head_commit.message == 'pilot: single Jobandtalent two-cycle live read-only' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify two-cycle offline safety regressions
        run: python -m unittest discover -s tests -p 'test_jobandtalent_live_pilot.py' -v
      - name: One JobTech discovery plus two exact ATS reads, temporary finalize only
        run: |
          python -m scripts.pilot_jobandtalent_two_cycles \
            --output .staging/pilot/jobandtalent-20261117.json
      - name: Present measured outcomes, distinguishing staging from production
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('.staging/pilot/jobandtalent-20261117.json')
          report=json.loads(path.read_text()) if path.exists() else {'state':'report-not-created'}
          keys=('state','total_requests','total_bytes_read','elapsed_seconds',
                'baseline_jobs','distinct_staging_new_vs_baseline',
                'idempotent_second_cycle','net_new_distinct_verified_in_production',
                'source_enabled','catalog_modified','applications_submitted',
                'browser_renderings')
          text='## Jobandtalent opt-in two-cycle pilot — NOT PRODUCTION\n\n'
          text+='\n'.join('- '+k+': '+str(report.get(k)) for k in keys)+'\n'
          for cycle in report.get('cycles',[]):
              text+=f"\n- Cycle {cycle['cycle']}: "+json.dumps(cycle,sort_keys=True,ensure_ascii=False)
          Path('jobandtalent-pilot-summary.md').write_text(text+'\n')
          print(text)
          PY
          cat jobandtalent-pilot-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain only sanitized measurements for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobandtalent-single-pilot-20261117
          path: |
            .staging/pilot/jobandtalent-20261117.json
            jobandtalent-pilot-summary.md
          retention-days: 7
          if-no-files-found: warn
