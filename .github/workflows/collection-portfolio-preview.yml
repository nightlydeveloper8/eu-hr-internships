name: Evaluate collection portfolio offline
on:
  push:
    branches: ['analysis/collection-portfolio-20261120']
    paths: ['.github/workflows/collection-portfolio-preview.yml']
permissions:
  contents: read
jobs:
  evaluate:
    if: github.event.head_commit.message == 'Rank portfolio work and collect application route evidence without extra requests'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate against the unchanged catalog snapshot
        run: |
          python -m unittest discover -s tests -p 'test_collection_portfolio.py' -v
          SECONDS=0
          python -m scripts.collection_portfolio > /tmp/collection-portfolio-a.json
          python -m scripts.collection_portfolio > /tmp/collection-portfolio-b.json
          cmp /tmp/collection-portfolio-a.json /tmp/collection-portfolio-b.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/collection-portfolio-a.json').read_text())
          adapters=report['adapters']
          countries=report['countries']
          assert sum(d['direct'] for d in countries.values())==33
          assert sum(d['public_listings'] for d in countries.values())==365
          assert sum(d['public_leads_with_external_url'] for d in countries.values())==5
          assert report['application_review'][0]['source_id']=='employer-adecco-group'
          assert report['application_review'][0]['candidates']==84
          assert next(x for x in report['public_employer_clusters'] if x['country']=='IT')['listings']==34
          detail=dict(snapshot=report['snapshot_at'], sources=report['recent_coverage'],
                      totals={k:sum(r.get(k,0) for r in adapters.values()) for k in (
                          'reported_request_attempts','requests_with_explicit_zero_matches',
                          'requests_unknown_sources','complete_inventories')},
                      universal=adapters['universal-employer'],
                      public={k:sum(d[k] for d in countries.values()) for k in next(iter(countries.values()))},
                      providers=sorted(report['provider_signals'].items(),
                                       key=lambda item: -item[1]['sources_with_recent_measurements'])[:8],
                      queue=report['application_review'][:10],
                      active_countries=sum(d['direct']>0 for d in countries.values()),
                      public_countries=sum(d['public_listings']>0 for d in countries.values()))
          print('PORTFOLIO_OFFLINE '+json.dumps(detail,ensure_ascii=False),flush=True)
          PY
          printf 'PORTFOLIO_OFFLINE_SECONDS %s\n' "$SECONDS"
          git diff --exit-code -- data
