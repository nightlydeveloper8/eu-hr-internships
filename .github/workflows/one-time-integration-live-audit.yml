name: One-time PL DK integrated pre-release verification
# Re-run after correcting Danish date-only midnight serialization to inclusive local-day cutoff.

on:
  pull_request:
    paths:
      - '.github/workflows/one-time-integration-live-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.pull_request.head.repo.full_name == 'nightlydeveloper8/eu-hr-internships' && github.event.pull_request.head.ref == 'audit/integrated-staging-one-time-retry' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cross-country policy gates and expiry checks (offline)
        run: python -m unittest tests.test_jks_scope tests.test_preview_internal_recruitee tests.test_three_country_release_candidate -v
      - name: Denmark JKS — employer deadline and exact project form (staging only)
        run: |
          python - <<'PY'
          import json
          from scripts.preview_jks_internships import preview
          result = preview()
          print("JKS_RETRY " + json.dumps(result, sort_keys=True, ensure_ascii=False))
          assert result["report"]["closure_complete"] is False, "Never close on partial inventory"
          assert result["ids_after"] - result["ids_before"] == 4, "Expected distinct JKS IDs not established"
          assert result["direct_after"] - result["direct_before"] == 4, "Current JKS same-project forms missing"
          assert len(result["proofs"]) == 4 and all(p.get("valid_through") for p in result["proofs"]), "Employer deadlines missing"
          assert result["requests"] <= 24
          PY
      - name: Poland SmartWays — registered disabled source and exact Recruitee form
        run: |
          python - <<'PY'
          import json
          from scripts.preview_internal_recruitee import preview
          result = preview()
          print("SMARTWAYS_RETRY " + json.dumps(result, sort_keys=True, ensure_ascii=False))
          assert result["source_enabled"] is False and result["catalog_modified"] is False
          assert result["state"] == "staging" and result["idempotent"] is True
          assert result["ids_after"] - result["ids_before"] == 1
          assert result["direct_after"] - result["direct_before"] == 1
          assert len(result["verified"]) == 1 and result["verified"][0]["posting_id"] == "31252"
          assert result["requests"] <= 14
          PY
