name: Temporary ATS XML and coverage-history diagnostics
on:
  push:
    branches: [research/ats-and-cadence-20261117]
    paths: ['.github/workflows/oneoff-ats-cadence-audit-20261117.yml']
permissions:
  contents: read
jobs:
  history-report-fields:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect per-source reports and day availability offline
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess,collections
          def git(*a):return subprocess.check_output(['git',*a],text=True)
          for path in ('data/coverage.json','data/employer-collection.json'):
              d=json.loads(git('show','HEAD:'+path))
              key='sources' if 'sources' in d else 'employers'
              rows=d[key]
              print('HIST_SUM '+json.dumps({'path':path,'rows':len(rows),'first_keys':list(rows[0].keys()),
                  'first_values':{k:str(v)[:110] for k,v in rows[0].items() if k not in ('errors','pending_urls')},
                  'types':dict(collections.Counter(str(x.get('status',x.get('state'))) for x in rows))}))
              for term in ('auto-salomon','auto-sia','auto-bosch','auto-tilburg-university','recruitee'):
                  matches=[x for x in rows if term in str(x.get('id',x.get('name'))).lower()]
                  if matches:print('HIST_SAMPLE '+json.dumps({'path':path,'term':term,'rows':[{k:v if isinstance(v,(str,int,float,bool,type(None))) else str(v)[:120] for k,v in x.items()} for x in matches[:1]]}))
          dates={}
          for row in git('log','--since=2026-11-04T00:00:00Z','--until=2026-11-18T00:00:00Z','--format=%H|%ad','--date=short','--','data/coverage.json').splitlines():
              sha,date=row.split('|')
              if date not in dates:dates[date]=sha
          print('HIST_DAYS '+json.dumps({k:v[:12] for k,v in dates.items()},sort_keys=True))
          PY
  public-recruitee-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify published Ampelmann XML link evidence without authenticating
        shell: bash
        run: |
          python - <<'PY'
          import json,time
          from xml.etree import ElementTree as ET
          from urllib.parse import urlsplit
          from collector.runtime import BudgetClient
          from collector.universal import Document
          from collector.verification import same_title,structured_identifiers,applicant_form
          origin='careers.ampelmann.nl'
          feed='https://careers.ampelmann.nl/api/feeds/offers.xml'
          out={'feed':feed,'no_post':True,'auth_used':False,'policy_verified':False}
          c=BudgetClient(seconds=42,max_requests=5,delay=.8)
          c.redirect_scope_allowed=lambda u:urlsplit(u).scheme=='https' and urlsplit(u).hostname==origin
          start=time.monotonic()
          try:
              body,code,final=c.request(feed,attempts=1,timeout=11,accept='application/xml')
              root=ET.fromstring(body)
              out.update(feed_status=code,root=root.tag,children=len(root))
              found=[]
              for element in root:
                  # Document only the exact job's own metadata, never the entire feed or descriptions.
                  direct={child.tag.split('}')[-1]:(child.text or '').strip() for child in element if len(child)==0}
                  title=next((x for k,x in direct.items() if k.lower()=='title'),None)
                  if title=='Internship People & Organisation':
                      found.append((element,direct))
              out['match_count']=len(found)
              if len(found)==1:
                  elem,fields=found[0]
                  out['offer_direct_tag_names']=sorted(fields)
                  out['matching_offer_id']={k:v for k,v in fields.items() if k.lower() in ('id','offer_id','external_id')}
                  links={k:v for k,v in fields.items() if 'url' in k.lower() or 'link' in k.lower()}
                  out['published_links']=links
                  all_links={k:v for k,v in links.items() if urlsplit(v).scheme=='https' and urlsplit(v).hostname==origin}
                  apply_links=[v for k,v in all_links.items() if 'apply' in k.lower() or '/c/new' in urlsplit(v).path]
                  if len(apply_links)==1:
                      target=apply_links[0]
                      html,st,finalurl=c.request(target,attempts=1,timeout=11)
                      doc=Document(html,finalurl)
                      out.update(application_get=st,application_same_url=finalurl==target,
                                 application_same_title=same_title(doc,'Internship People & Organisation'),
                                 application_ids=sorted(structured_identifiers(doc,'Internship People & Organisation')),
                                 application_form_strict=applicant_form(html,strict=True))
                  else:out['application_reason']='No unique employer-published same-host apply URL in XML'
              else:out['application_reason']='Matching current official offer not uniquely identified'
          except Exception as e:out['error']=type(e).__name__+': '+str(e)[:140]
          finally:
              out.update(requests=c.requests,bytes=c.bytes,seconds=round(time.monotonic()-start,3))
              print('AMP_XML_DETAIL '+json.dumps(out,sort_keys=True))
          PY
