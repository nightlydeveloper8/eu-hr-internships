name: One-time JKS expanded inventory audit

on:
  pull_request:
    paths:
      - '.github/workflows/jks-one-time-audit.yml'

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ github.event.pull_request.head.repo.full_name == 'nightlydeveloper8/eu-hr-internships' && github.event.pull_request.head.ref == 'audit/jks-expanded-live-recheck' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline JKS source policy checks
        run: python -m unittest tests.test_jks_scope -v
      - name: JKS bounded staging preview — no activation, no application submission
        run: python -m scripts.preview_jks_internships
