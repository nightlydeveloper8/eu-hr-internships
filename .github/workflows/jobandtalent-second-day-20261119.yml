name: Second-day Jobandtalent candidature and mirror check
on:
  push:
    branches: ['pilot/verification-growth-20261119']
    paths: ['.github/workflows/jobandtalent-second-day-20261119.yml']
permissions:
  contents: read
jobs:
  preview:
    if: github.event.head_commit.message == 'Verify Jobandtalent on a second date against the current catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '3f20f511092d7cd5cb12aa3428bf8b4edc0ca3e6'
          path: current
          sparse-checkout: data/catalog.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 'fb523c6157261b5870e749d67b24858d2858d0e9'
          path: reviewed
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test disabled source guard and run one current-catalog preview
        working-directory: reviewed
        run: |
          python -m unittest discover -s tests -p 'test_jobtech_daily_adapter.py' -v
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from collector.official_feed_adapter import source_gate
          from collector.pipeline import ROOT, now, process_source, read
          from collector.runtime import BudgetClient

          path = Path('../current/data/catalog.json')
          baseline = read(path, {})
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          registry = read(ROOT / 'data/sources.json', [])
          source = next(s for s in registry if s['id']=='staging-jobandtalent-se')
          source_gate(source,preview=True)
          assert source['enabled'] is False
          client=BudgetClient(seconds=source['collection_seconds'],max_requests=source['max_requests'],delay=1)
          part=process_source(source,client,now(),verify=True,official_feed_preview=True,official_feed_prior_jobs=baseline['jobs'])
          report=part['report']
          assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          existing=[{'id': j['id'], 'source_id':j['source_id'], 'policy':j['verification'].get('policy')} for j in baseline['jobs']
                    if j.get('external_id') == source['provider_id'] and j.get('source_id') == 'public-se-jobtech']
          fields=('dossier_state','dossier_ats_id','dossier_inventory_confirmed','reason','feed_rows_scanned','requests',
                  'feed_requests','ats_requests','bytes_read','duration_seconds','status')
          print('JOBANDTALENT_RECHECK '+json.dumps({**{k:report.get(k) for k in fields},'source_enabled':source['enabled'],
              'staging_rows':len(part['jobs']), 'existing_public_copy':existing,'closure_eligible':part['closure_eligible']}),flush=True)
          PY
