name: One-off official employer apply-gap diagnosis
on:
  push:
    branches: [diagnose/current-official-apply-gaps-20261117]
    paths:
      - '.github/workflows/official-apply-gaps-oneoff-20261117.yml'
permissions:
  contents: read
concurrency:
  group: official-apply-gaps-20261117
  cancel-in-progress: false
jobs:
  bounded-diagnosis:
    if: "${{ github.event.head_commit.message == 'diagnose: one bounded official CTA probe' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm current verification gates offline
        run: python -m unittest discover -s tests -p 'test_rate_limit_and_filled.py' -v
      - name: Exactly two employer pages, current reviewed hosts only
        run: python -m scripts.probe_application_patterns --output .staging/probe/apply-gaps.json
      - name: Summarize read-only outcomes
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.staging/probe/apply-gaps.json')
          report=json.loads(p.read_text()) if p.exists() else {'mode':'report-absent'}
          print('Official CTA diagnostic:',json.dumps(report,ensure_ascii=False,sort_keys=True))
          PY
      - name: Retain sanitized proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-apply-gaps-20261117
          path: .staging/probe/apply-gaps.json
          retention-days: 5
          if-no-files-found: warn
