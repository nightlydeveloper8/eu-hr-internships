name: Adecco application entry sample
on:
  push:
    branches: ['pilot/adecco-application-entry-20261119']
    paths: ['.github/workflows/adecco-entry-pilot-20261119.yml']
permissions:
  contents: read
jobs:
  sample:
    if: github.event.head_commit.message == 'Measure four Adecco HR application entries'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect four official posting pages
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from urllib.parse import parse_qs, urljoin, urlsplit
          
          from collector.classify import fold
          from collector.pipeline import ROOT, now, read
          from collector.runtime import BudgetClient
          from collector.universal import Document
          from collector.verification import applicant_form, same_title, structured_identifiers, verify_vacancy
          
          source = next(s for s in read(ROOT / 'data/sources.json', []) if s['id'] == 'employer-adecco-group')
          catalog = read(ROOT / 'data/catalog.json', {})['jobs']
          cities = ('falaise', 'argentan', 'toulouse', 'bordeaux')
          rows = [next(j for j in catalog if j['source_id'] == source['id'] and j['status'] == 'unverified'
                       and fold(j['city']) == city) for city in cities]
          host = source['allowed_hosts'][0]
          budget = BudgetClient(seconds=60, max_requests=12, delay=1)
          budget.redirect_scope_allowed = lambda url: urlsplit(url).scheme == 'https' and urlsplit(url).hostname == host
          
          class RecordingClient:
              def __init__(self):
                  self.pages = {}
              def request(self, url, method='GET', **kwargs):
                  if method != 'GET' or not budget.redirect_scope_allowed(url):
                      raise ValueError('Outside reviewed GET scope')
                  response = budget.request(url, method=method, **kwargs)
                  self.pages[url] = response
                  return response
          
          measurements = []
          start = time.monotonic()
          for j in rows:
              client = RecordingClient()
              url = j['url']
              site_id = urlsplit(url).path.rsplit('/', 1)[-1]
              record = dict(j, inventory_evidence='current-employer-feed')
              status = dict(city=j['city'], posting_id=site_id, catalog_id=j['id'])
              try:
                  evidence = verify_vacancy(record, source, client, now())
                  status.update(proven=True, method=evidence['method'])
              except Exception as exc:
                  status.update(proven=False, exception=type(exc).__name__, reason=str(exc)[:180])
              if url in client.pages:
                  body, code, final = client.pages[url]
                  doc = Document(body, final)
                  ids = structured_identifiers(doc, j['title'])
                  targets = []
                  for href, label, attrs in doc.links:
                      class_name = attrs.get('class', '') if isinstance(attrs, dict) else ''
                      if not re.search(r'apply|postuler|candidater', fold(label) + ' ' + str(class_name)):
                          continue
                      target = urlsplit(urljoin(doc.url, href))
                      if target.scheme != 'https' or not target.hostname:
                          continue
                      tokens = set(target.path.split('/')) | {v for vals in parse_qs(target.query).values() for v in vals}
                      row = dict(host=target.hostname, approved=target.hostname in source['allowed_hosts'],
                                 carries_observed_identifier=bool(({site_id} | ids) & tokens))
                      if row not in targets:
                          targets.append(row)
                  status.update(http=code, title_matches=same_title(doc, j['title']), structured_ids=sorted(ids), strict_form=applicant_form(body, strict=True), targets=targets[:6])
              measurements.append(status)
              if status.get('reason', '').startswith('robots.txt') or '429' in status.get('reason', ''):
                  break
          print('ADECCO_RESULT ' + json.dumps({
              'attempts': len(measurements), 'requests': budget.requests, 'bytes': budget.bytes,
              'seconds': round(time.monotonic()-start,3), 'rows': measurements,
              'new_application_proofs': sum(m['proven'] for m in measurements), 'renderings': 0,
          }), flush=True)
          PY
