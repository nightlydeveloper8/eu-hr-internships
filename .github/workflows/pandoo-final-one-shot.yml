name: PANDOO Luxembourg last one-shot evidence replay
on:
  push:
    branches:
      - pilot/eu27-pandoo-direct-email-20261116
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Review two employer pages without application submission
        run: python -m scripts.one_shot_pandoo_proof
