name: TEMP Ampelmann disabled registry branch-only (remove after)
on:
  push:
    branches: [prep/ampelmann-disabled-20261117]
    paths:
      - '.github/workflows/temp-ampelmann-disabled-20261117.yml'
permissions:
  contents: write
jobs:
  prepare-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test disabled-source and hold safety first
        run: python -m unittest discover -s tests -p test_ampelmann_disabled_provision.py -v
      - name: Simulate then prepare reviewed DISABLED registry records
        run: |
          python -m scripts.prepare_ampelmann_disabled
          python -m scripts.prepare_ampelmann_disabled --apply
          python -m collector.daily provision
          python -m collector.pipeline --validate
      - name: Commit only reviewed registry changes to this isolated branch
        run: |
          test "$GITHUB_REF_NAME" = "prep/ampelmann-disabled-20261117"
          git diff --stat -- data/companies.json data/sources.json
          git diff --name-only | grep -Ev '^(data/companies.json|data/sources.json)$' && exit 1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/companies.json data/sources.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: stage Ampelmann company and Recruitee feed disabled with hold"
            git push origin HEAD:prep/ampelmann-disabled-20261117
          fi
