name: Ampelmann second-day staging
on:
  push:
    branches: ['pilot/ampelmann-second-day-20261119']
    paths: ['.github/workflows/ampelmann-second-day-20261119.yml']
permissions:
  contents: read
jobs:
  staging:
    if: github.event.head_commit.message == 'Run bounded Ampelmann second-day staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Ampelmann in temporary staging
        run: |
          python - <<'PY'
          import json,time,tempfile
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from collector.runtime import BudgetClient
          from collector.pipeline import process_source,finalize,read,ROOT
          source={
              'id':'staging-ampelmann-nl','employer':'Ampelmann Operations B.V.',
              'adapter':'recruitee','enabled':False,
              'feed_format':'recruitee-public-xml','application_check':'recruitee-linked',
              'feed_url':'https://careers.ampelmann.nl/api/feeds/offers.xml',
              'allowed_hosts':['careers.ampelmann.nl'],
              'target_countries':['NL'],
              'ownership_scope':'reviewed-hosts','require_employer_identity':True,
              'permission_basis':'Official public XML and same-ID published careers application; runtime robots checks',
              'max_requests':10,'collection_seconds':45}
          initial=read(ROOT/'data/catalog.json',{})
          prior=initial
          prior_cov=read(ROOT/'data/coverage.json',{})
          source_registry=read(ROOT/'data/sources.json',[])
          report={'baseline_jobs':len(prior['jobs']),
                  'baseline_open_hr_internships':sum(x.get('status')=='open' and x.get('internship_type')=='internship' for x in prior['jobs']),
                  'disabled_in_registry':True,'production_changed':False,
                  'cycles':[],'post_requests':0,'renderings':0}
          with tempfile.TemporaryDirectory(prefix='people-placement-staging-') as folder:
              for n in (1,):
                  c=BudgetClient(seconds=45,max_requests=10,delay=.6)
                  c.redirect_scope_allowed=lambda dest: urlsplit(dest).scheme=='https' and urlsplit(dest).hostname=='careers.ampelmann.nl'
                  stamp=datetime.now(timezone.utc).isoformat()
                  start=time.monotonic()
                  part=process_source(source,c,stamp,verify=True)
                  row={'cycle':n,'part_status':part['report']['status'],
                       'part_error':part['report'].get('error'),
                       'records_seen':part['report'].get('records_inspected'),
                       'matching':part['report'].get('matching'),
                       'verification_states':part['report'].get('verification_states'),
                       'closure_eligible':part['closure_eligible']}
                  target=[x for x in part['jobs'] if x.get('external_id')=='2822573']
                  row['target']=[{'id':x['id'],'title':x['title'],'country':x.get('country'),
                      'status':x.get('status'),'verification':x.get('verification',{}).get('state'),
                      'reason':x.get('verification',{}).get('reason'),
                      'method':x.get('application_verification',{}).get('method'),
                      'apply_url':x.get('apply_url')} for x in target]
                  if n==1:
                      row['first_pre_finalize_target']=row['target']
                  output,cov=finalize(source_registry+[source],[source],prior,prior_cov,[part],stamp,Path(folder))
                  staged=[x for x in output['jobs'] if x.get('source_id')==source['id']]
                  row['after_finalize']=[{'id':x['id'],'status':x['status'],
                          'verification':x.get('verification',{}).get('state')}
                          for x in staged]
                  row['catalog_size']=len(output['jobs'])
                  row['baseline_ids_preserved']=set(x['id'] for x in initial['jobs']).issubset(x['id'] for x in output['jobs'])
                  row.update(http=c.requests,bytes=c.bytes,seconds=round(time.monotonic()-start,3))
                  report['cycles'].append(row)
                  prior,prior_cov=output,cov
                  if not target or target[0].get('verification',{}).get('state')!='verified':
                      break
          report['total_http']=sum(x['http'] for x in report['cycles'])
          report['total_bytes']=sum(x['bytes'] for x in report['cycles'])
          report['total_seconds']=round(sum(x['seconds'] for x in report['cycles']),3)
          report['staging_verified_target']=len(report['cycles'])==1 and all(
             len(x.get('after_finalize',[]))==1 and x['after_finalize'][0]['verification']=='verified'
             for x in report['cycles'])
          print('AMP_STAGING '+json.dumps(report,sort_keys=True))
          assert report['staging_verified_target'], 'No verified Ampelmann record in staging on this date'
          assert all(r['baseline_ids_preserved'] and not r['closure_eligible'] and r['after_finalize'][0]['id']=='b05fc810ebc3e04dc51b' for r in report['cycles'])
          PY
