name: EU27 batch09 one-shot official GET review
on:
  push:
    branches:
      - pilot/eu27-batch09-one-shot-20261116
permissions:
  contents: read
jobs:
  one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded robots-guarded requests only
        run: python -m scripts.one_shot_batch09_preflight
