name: One-off reviewed JobTech disabled-adapter live preview
# One requested read-only pilot; never scheduled and not in main/PR feature branch.
on:
  push:
    branches: [pilot/jobtech-adapter-20261117]
    paths:
      - '.github/workflows/jobtech-adapter-oneoff-20261117.yml'
permissions:
  contents: read
concurrency:
  group: jobtech-adapter-oneoff-20261117
  cancel-in-progress: false
jobs:
  single-disabled-source-preview:
    if: "${{ github.event.head_commit.message == 'pilot: one reviewed JobTech adapter live preview' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline adapter and disabled-source safety tests
        run: python -m unittest discover -s tests -p 'test_jobtech_daily_adapter.py' -v
      - name: One real JobTech plus exact Jobandtalent ATS read only
        run: |
          python -m scripts.preview_reviewed_feed_source \
            --source-id staging-jobandtalent-se \
            --output .staging/pilot/jobtech-adapter-20261117.json
      - name: Display measured costs and staged-vs-production result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.staging/pilot/jobtech-adapter-20261117.json')
          r=json.loads(p.read_text()) if p.exists() else {'state':'incomplete-preflight-no-report'}
          lines=['## Reviewed JobTech adapter read-only pilot — NOT PRODUCTION', '']
          fields=('state','source_id','provider_id','expected_ats_id','feed_rows_scanned',
                  'feed_hr_candidates','requests','feed_requests','ats_requests',
                  'bytes_read','feed_bytes_read','ats_bytes_read','elapsed_seconds',
                  'verified_staging_new_distinct','baseline_catalog_ids_lost',
                  'duplicate_catalog_ids','staging_verified_internships',
                  'production_verified_vacancies_added','production_catalog_modified',
                  'applications_submitted','source_enabled','reason')
          lines.extend('- '+key+': '+str(r.get(key)) for key in fields)
          text='\n'.join(lines)+'\n'
          Path('jobtech-adapter-pilot-summary.md').write_text(text)
          print(text)
          PY
          cat jobtech-adapter-pilot-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain sanitized one-off audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobtech-adapter-oneoff-20261117
          path: |
            .staging/pilot/jobtech-adapter-20261117.json
            jobtech-adapter-pilot-summary.md
          retention-days: 7
          if-no-files-found: warn
