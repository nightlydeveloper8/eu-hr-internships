name: Validate application
on:
  push:
    paths-ignore: ['data/catalog.json', 'data/coverage.json', 'docs/evaluation-report.json']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.js
      - run: python scripts/evaluate.py
      - run: python scripts/company_coverage.py
      - run: python scripts/build.py
  corporate-tls-staging:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/review-corporate-sitemap-lot'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect the ten TLS controls in staging
        run: |
          mkdir -p .staging/corporate-tls
          python - <<'PYTHON'
          import json, os, ssl, sys
          from pathlib import Path
          print(sys.version, ssl.OPENSSL_VERSION)
          print('Proxy configuration present:', any(k.lower().endswith('_proxy') for k in os.environ))
          hosts = set('careers.dhl.com jobs.mtu.de careers.solvay.com jobs.sonova.com careers.munichre.com jobs.volvogroup.com apply.careers.hsbc.com www.henkel.com about.puma.com careers.demant.com'.split())
          registry = json.loads(Path('data/sources.json').read_text())
          selected = [source for source in registry if source.get('collection_lot') == 'CORPORATE-SITEMAP-TERMS' and hosts.intersection(source['allowed_hosts'])]
          assert len(selected) == 10
          manifest = {'CORPORATE-SITEMAP': {'sources': [{'source': dict(s, enabled=False, collection_activation_hold=True)} for s in selected]}}
          Path('.staging/corporate-tls/manifest.json').write_text(json.dumps(manifest))
          PYTHON
          python -m scripts.stage_held_career_lot CORPORATE-SITEMAP --simulate-active --manifest .staging/corporate-tls/manifest.json > .staging/corporate-tls/output.log
          result=$(tail -1 .staging/corporate-tls/output.log)
          cp "$result" "$(dirname "$result")/parts.json" .staging/corporate-tls/
      - uses: actions/upload-artifact@v4
        with:
          name: corporate-tls-staging
          path: .staging/corporate-tls/
          include-hidden-files: true
          retention-days: 7
