name: EU27 batch07 one-shot robots and form preflight
on:
  push:
    branches:
      - pilot/eu27-batch07-readonly-20261116
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded GET-only robots preflight on reviewed hosts
        run: python -m scripts.one_shot_batch07_preflight
