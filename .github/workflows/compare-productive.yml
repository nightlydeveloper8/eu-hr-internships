name: Compare productive EURES markets
on:
  pull_request:
    types: [synchronize]
    paths: ['.github/workflows/compare-productive.yml']
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'research/market-conversions-first-pass'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -u -m scripts.pilot_eures_country_round --productive
