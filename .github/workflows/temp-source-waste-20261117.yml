name: TEMP offline source-cost audit (remove after measurement)
on:
  push:
    branches: [analysis/source-waste-audit-20261117]
    paths:
      - .github/workflows/temp-source-waste-20261117.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s tests -p 'test_audit_source_waste.py' -v
      - name: Source-waste baseline from committed report
        run: python -m scripts.audit_source_waste --date 2026-11-17 --topn 12
