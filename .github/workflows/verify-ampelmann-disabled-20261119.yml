name: Verify Ampelmann adapter and disabled daily collection
on:
  push:
    branches: ['verify/ampelmann-disabled-20261119']
    paths: ['.github/workflows/verify-ampelmann-disabled-20261119.yml']
permissions:
  contents: read
jobs:
  check:
    if: github.event.head_commit.message == 'Verify Ampelmann XML and disabled provisioning'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test XML, Recruitee application and daily hold
        run: PYTHONPATH=tests python -m unittest test_recruitee_public_xml test_recruitee_application test_ampelmann_disabled_provision test_all_employers
      - name: Verify real registry and run one isolated Ampelmann probe
        run: |
          python - <<'PY'
          import hashlib
          import json
          import tempfile
          import time
          from pathlib import Path
          from urllib.parse import urlsplit
          
          from collector.company_registry import validate_registry
          from collector.daily import collect_shard, provision, provision_files
          from collector.pipeline import ROOT, finalize, now, process_source, read
          from collector.runtime import BudgetClient
          from scripts.prepare_ampelmann_disabled import COMPANY_ID, SOURCE_ID, prepare
          
          company_path = ROOT / 'data/companies.json'
          source_path = ROOT / 'data/sources.json'
          catalog_path = ROOT / 'data/catalog.json'
          before_digest = hashlib.sha256(catalog_path.read_bytes()).hexdigest()
          base_companies, base_sources = provision(read(company_path, []), read(source_path, []))
          prepared_companies, prepared_sources, result = prepare(base_companies, base_sources)
          assert validate_registry(prepared_companies, read(ROOT / 'data/geography.json', {}), prepared_sources)
          assert len(prepared_companies) == len(base_companies) + 1
          assert len(prepared_sources) == len(base_sources) + 1
          
          def enabled_ids(sources):
              return {s['id'] for s in sources if s.get('enabled')}
          
          assert enabled_ids(prepared_sources) == enabled_ids(base_sources)
          assert all(s.get('company_id') != COMPANY_ID for s in prepared_sources if s.get('enabled'))
          company_path.write_text(json.dumps(prepared_companies))
          source_path.write_text(json.dumps(prepared_sources))
          for _ in range(2):
              assert provision_files() == (prepared_companies, prepared_sources)
          try:
              collect_shard(shard=0, shards=16, source_ids=[SOURCE_ID], run_id='ampelmann-hold-check')
          except ValueError as exc:
              assert 'Unknown or disabled source IDs' in str(exc) and SOURCE_ID in str(exc)
          else:
              raise AssertionError('Ordinary collection did not reject the source')
          
          replacement = next(s for s in prepared_sources if s['id'] == SOURCE_ID)
          assert replacement['enabled'] is False
          try:
              provision(prepared_companies, prepared_sources + [dict(replacement, id='unlisted-ampelmann-source', enabled=True)])
          except ValueError as exc:
              assert 'Held employer has an enabled source' in str(exc)
          else:
              raise AssertionError('A held employer still permits an unlisted enabled source')
          
          print('HOLD_RESULT ' + json.dumps({
              **result, 'employers_before': len(base_companies), 'employers_after': len(prepared_companies),
              'active_before': len(enabled_ids(base_sources)), 'active_after': len(enabled_ids(prepared_sources)),
              'ordinary_selector_rejected': True, 'unlisted_active_rejected': True, 'reprovisionings': 2,
          }), flush=True)
          
          client = BudgetClient(seconds=45, max_requests=10, delay=.6)
          client.redirect_scope_allowed = lambda dest: (
              urlsplit(dest).scheme == 'https' and urlsplit(dest).hostname == 'careers.ampelmann.nl'
          )
          stamp = now()
          prior = read(catalog_path, {})
          coverage = read(ROOT / 'data/coverage.json', {})
          start = time.monotonic()
          part = process_source(dict(replacement, max_requests=10, collection_seconds=45), client, stamp, verify=True)
          elapsed = round(time.monotonic() - start, 3)
          with tempfile.TemporaryDirectory(prefix='ampelmann-80-65-') as folder:
              output, report = finalize(prepared_sources, [replacement], prior, coverage, [part], stamp, Path(folder))
              repeat, _ = finalize(prepared_sources, [replacement], output, report, [part], stamp, Path(folder))
          
          assert hashlib.sha256(catalog_path.read_bytes()).hexdigest() == before_digest
          staged = [row for row in output['jobs'] if row['source_id'] == SOURCE_ID]
          staged_again = [row for row in repeat['jobs'] if row['source_id'] == SOURCE_ID]
          old_ids = {j['id'] for j in prior['jobs']}
          new_ids = {j['id'] for j in output['jobs']}
          print('STAGING_RESULT ' + json.dumps({
              'http': client.requests, 'bytes': client.bytes, 'seconds': elapsed,
              'source_status': part['report']['status'], 'source_error': part['report'].get('error'),
              'closure_eligible': part['closure_eligible'], 'catalog_before': len(old_ids),
              'catalog_after': len(new_ids), 'removed': len(old_ids-new_ids), 'new': len(new_ids-old_ids),
              'repeat_ids_stable': {j['id'] for j in repeat['jobs']} == new_ids,
              'ampelmann': [{'id': j['id'], 'posting_id': j['external_id'], 'title': j['title'],
                             'status': j['status'], 'country': j['country'],
                             'method': (j.get('application_verification') or {}).get('method'),
                             'policy_version': j['verification'].get('policy_version')} for j in staged],
          }), flush=True)
          assert not (old_ids-new_ids) and len(new_ids-old_ids) == 1 and not part['closure_eligible']
          assert len(staged) == len(staged_again) == 1 and staged[0]['id'] == staged_again[0]['id']
          job = staged[0]
          assert job['status'] == 'open' and job['external_id'] == '2822573' and job['country'] == 'NL'
          assert job['verification']['state'] == 'verified' and job['verification']['policy_version'] == 2
          assert job['application_verification']['method'] == 'official-recruitee-same-posting-visible-form'
          PY
      - name: Validate catalog after temporary disabled provisioning
        run: python -m collector.pipeline --validate
