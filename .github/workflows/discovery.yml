name: Weekly source discovery
on:
  schedule:
    - cron: '43 1 * * 1'
  workflow_dispatch:
  workflow_run:
    workflows: [Daily employer collection]
    branches: [main]
    types: [completed]
permissions: {}
concurrency:
  group: weekly-source-discovery
  cancel-in-progress: false
jobs:
  discovery:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and replay reviewed sources
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow collect.yml --branch main --status success --limit 3 \
            --json startedAt,updatedAt > "$RUNNER_TEMP/collection-baselines.json"
          baseline=$(python - "$RUNNER_TEMP/collection-baselines.json" <<'PY'
          from datetime import datetime
          import json
          import sys

          runs = json.load(open(sys.argv[1]))
          duration = [(datetime.fromisoformat(run['updatedAt']) -
                       datetime.fromisoformat(run['startedAt'])).total_seconds() for run in runs]
          print(round(max(duration, default=2100)))
          PY
          )
          python -m collector.weekly_discovery --baseline-seconds "$baseline" \
            --output "$RUNNER_TEMP/discovery/reports.json"
      - name: Check the completed collection
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/discovery-activations.json ]; then
            exit 0
          fi
          state_dir="$RUNNER_TEMP/discovery"
          mkdir -p "$state_dir"
          run_id=$(jq -r .workflow_run.id "$GITHUB_EVENT_PATH")
          attempt=$(jq -r .workflow_run.run_attempt "$GITHUB_EVENT_PATH")
          commit=$(jq -r .workflow_run.head_sha "$GITHUB_EVENT_PATH")
          git fetch origin "$commit"
          git show "$commit:data/sources.json" > "$state_dir/run-sources.json"
          git show "$commit:data/catalog.json" > "$state_dir/before.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100" \
            --jq '.jobs[]' | jq -s . > "$state_dir/jobs.json"
          jq --slurpfile jobs "$state_dir/jobs.json" '.workflow_run + {jobs: $jobs[0]}' \
            "$GITHUB_EVENT_PATH" > "$state_dir/event.json"
          if gh run download "$run_id" --name catalog-and-coverage --dir "$state_dir/collection"; then
            before="$state_dir/collection/.staging/metrics/catalog.json"
            after="$state_dir/collection/data/catalog.json"
            if [ -f "$before" ] && [ -f "$after" ]; then
              cp "$before" "$state_dir/before.json"
              cp "$after" "$state_dir/after.json"
            fi
          fi
          python -m collector.weekly_discovery --audit-event "$state_dir/event.json" \
            --run-sources "$state_dir/run-sources.json" --before "$state_dir/before.json" \
            --after "$state_dir/after.json" --output "$state_dir/reports.json"
      - name: Save the reviewed activation or rollback
        run: |
          if [ ! -f data/discovery-activations.json ]; then
            exit 0
          fi
          git add data/sources.json data/discovery-activations.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Apply reviewed weekly source discovery decisions'
            git push origin HEAD:main
          fi
      - name: Update the weekly issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const reportPath = path.join(process.env.RUNNER_TEMP, 'discovery', 'reports.json');
            if (!fs.existsSync(reportPath)) return;
            const reports = JSON.parse(fs.readFileSync(reportPath));
            for (const [week, report] of Object.entries(reports)) {
              const title = `Scoperta fonti – settimana ${Number(week.slice(-2))}`;
              const marker = `<!-- discovery:${week} -->`;
              const existing = await github.paginate(github.rest.issues.listForRepo, {
                ...context.repo, state: 'all', creator: 'github-actions[bot]', per_page: 100
              });
              const issue = existing.find(item => item.body?.startsWith(marker));
              if (issue && report.ran === false && issue.body?.includes('### Stage aggiunti per paese')) continue;
              if (!issue && report.hold === undefined && !report.activation.includes(' — Rientro:')) continue;
              function section(name, value, limit) {
                if (value === undefined) {
                  return issue?.body?.split(`<!-- ${name}:start -->\n`)[1]
                    ?.split(`\n<!-- ${name}:end -->`)[0] ?? '';
                }
                return value.length <= limit ? value :
                  value.slice(0, limit) + `\n\n[Elenco completo nell’artefatto della scoperta](${run}).`;
              }
              const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const scan = report.hold === undefined ? '' : `\n\n[Scoperta e artefatto](${run})`;
              const body = [
                marker,
                `<!-- activation:start -->\n${section('activation', report.activation, 8000)}\n<!-- activation:end -->`,
                `<!-- hold:start -->\n${section('hold', report.hold === undefined ? undefined : '### Fonti in attesa di decisione' + report.hold + scan, 43000)}\n<!-- hold:end -->`,
                `<!-- collection:start -->\n${section('collection', report.collection === undefined ? undefined : '### Stage aggiunti per paese' + report.collection, 5000)}\n<!-- collection:end -->`,
              ].join('\n\n');
              if (!issue) await github.rest.issues.create({...context.repo, title, body});
              else if (issue.body !== body) {
                await github.rest.issues.update({...context.repo, issue_number: issue.number, body});
              }
            }
      - name: Retain the per-host observations
        if: always() && github.event_name != 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: discovery-observations
          path: ${{ runner.temp }}/discovery/observations.json
          if-no-files-found: ignore
