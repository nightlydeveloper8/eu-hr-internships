name: Validate published application entry points
on:
  push:
    branches: ['pilot/adecco-talentsoft-20261120']
    paths: ['.github/workflows/adecco-talentsoft-review.yml']
permissions:
  contents: read
jobs:
  review:
    if: github.event.head_commit.message == 'Review published application entry points and diagnose site access'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python - <<'PY'
          import json
          import re
          import time
          from urllib.error import HTTPError
          from urllib.parse import parse_qs, urljoin, urlsplit
          from urllib.request import urlopen
          
          from collector.applications import checked_document
          from collector.ats_channel_discovery import safe_url
          from collector.classify import canonical_url, classify_role, fold
          from collector.pipeline import ROOT, read
          from collector.runtime import BudgetClient
          from collector.verification import applicant_form, same_title
          
          def report(label, **values):
              print(label + " " + json.dumps(values, ensure_ascii=False), flush=True)
          
          for kind, url in (
              ("production", "https://people-placement-eu.pages.dev/"),
              ("immutable", "https://2207ee5b.people-placement-eu.pages.dev/"),
              ("historical", "https://people-placement-eu.mysticbramble.chatgpt.site/"),
          ):
              try:
                  with urlopen(url, timeout=9) as response:
                      body = response.read(200000)
                      report("SITE_ORIGIN", kind=kind, status=response.status, server=response.headers.get("Server"),
                             final_url=response.geturl(), expected_app=b"People Placement" in body)
              except HTTPError as exc:
                  body = exc.read(4000).decode("utf-8", "replace")
                  title = re.search(r"<title[^>]*>(.*?)</title>", body, re.I|re.S)
                  report("SITE_ORIGIN", kind=kind, status=exc.code, server=exc.headers.get("Server"),
                         cf_ray=exc.headers.get("CF-Ray"), via=exc.headers.get("Via"),
                         title=title[1].strip()[:120] if title else None,
                         text=re.sub(r"\s+", " ", re.sub(r"<[^>]*>", " ", body)).strip()[:220])
              except Exception as exc:
                  report("SITE_ORIGIN", kind=kind, error=str(exc)[:140])
          
          class Scoped(BudgetClient):
              def request(self,url,method="GET",**kwargs):
                  if method!="GET" or not self.redirect_scope_allowed(url):
                      raise ValueError("URL outside the evidence set")
                  return super().request(url, method=method, **kwargs)
          
          client=Scoped(seconds=75,max_requests=14,delay=1)
          allowed=set()
          client.redirect_scope_allowed=lambda url: bool(safe_url(url) and canonical_url(url) in allowed)
          
          def doc(url):
              p=safe_url(url)
              assert p
              allowed.add(canonical_url(url))
              allowed.add(f"https://{p.hostname}/robots.txt")
              return checked_document(url, dict(allowed_hosts=[p.hostname]), client)
          
          start=time.monotonic()
          job=next(j for j in read(ROOT/"data/catalog.json",{})["jobs"] if j["id"]=="fd30839bb766e2c567a6")
          before=client.requests
          try:
              _, page=doc(job["url"])
              assert same_title(page,job["title"])
              talentsoft="theadeccogroup-career.talent-soft.com"
              cta=[urljoin(page.url,h) for h,l,_ in page.links if re.search(r"\b(?:apply|postuler|candidater)\b",fold(l))
                   and safe_url(urljoin(page.url,h)) and safe_url(urljoin(page.url,h)).hostname==talentsoft]
              assert len(set(cta))==1
              detail=cta[0]
              meta=parse_qs(urlsplit(detail).query)
              observed_ref=meta.get("offerReference",[])
              vacancy_number=meta.get("idOffre",[])
              exact_reference=observed_ref==[str(job["source_posting_id"])]
              _, page=doc(detail)
              assert same_title(page,job["title"])
              actions=[]
              linked=set()
              for href,label,_ in page.links:
                  if not re.search(r"\b(?:postuler|candidater|apply|candidature)\b",fold(label)):
                      continue
                  target=urljoin(page.url,href)
                  p=safe_url(target)
                  if not p:
                      continue
                  keys=parse_qs(p.query)
                  matching_number=bool(vacancy_number and any(v==vacancy_number for k,v in keys.items()
                                       if k.lower() in {"idoffre","offerid","jobid"}))
                  actions.append(dict(host=p.hostname,path=p.path,id_matches=matching_number))
                  if p.hostname==talentsoft and matching_number and canonical_url(target)!=canonical_url(detail):
                      linked.add(canonical_url(target))
              row=dict(reference_matches=exact_reference, numeric_id_present=len(vacancy_number)==1 and vacancy_number[0].isdigit(),
                       application_links=actions[:6],
                       application_buttons=sorted(set(b for b in page.buttons if re.search("postul|candid|apply",fold(b))))[:5])
              if exact_reference and len(linked)==1:
                  target=next(iter(linked))
                  html,app=doc(target)
                  row.update(next_title=same_title(app,job["title"]), next_strict_form=applicant_form(html,strict=True),
                             final_url_exact=canonical_url(app.url)==target)
              report("ADECCO_NEXT",requests=client.requests-before,**row)
          except Exception as exc:
              report("ADECCO_NEXT",requests=client.requests-before,error=str(getattr(exc,"reason",exc))[:150])
          
          allowed.clear()
          official="https://www.tacting.com/karriar/"
          board_host="tacting.teamtailor.com"
          before=client.requests
          try:
              _, page=doc(official)
              posting_pattern=r"/jobs/8621469(?:-[^/]+)?/?"
              posts={canonical_url(urljoin(page.url,h)) for h,_,_ in page.links
                     if safe_url(urljoin(page.url,h)) and safe_url(urljoin(page.url,h)).hostname==board_host
                     and re.fullmatch(posting_pattern,safe_url(urljoin(page.url,h)).path)}
              assert len(posts)==1, "Employer's current career page does not identify one exact posting"
              posting=posts.pop()
              html, job=doc(posting)
              titles=[t for t in job.h1 if classify_role(t) and classify_role(t)["internship_type"]=="internship"]
              assert len(set(titles))==1 and canonical_url(job.url)==posting
              role=titles[0]
              apply=form=applicant_form(html,strict=True)
              match=same_title(job,role)
              child=None
              if not form:
                  prefix=safe_url(posting).path.rstrip("/")
                  children={canonical_url(urljoin(job.url,h)) for h,_,_ in job.links
                            if safe_url(urljoin(job.url,h)) and safe_url(urljoin(job.url,h)).hostname==board_host
                            and safe_url(urljoin(job.url,h)).path.rstrip("/")==prefix+"/applications/new"}
                  if len(children)==1:
                      child=children.pop()
                      html,form_doc=doc(child)
                      form=applicant_form(html,strict=True)
                      match=same_title(form_doc,role) and canonical_url(form_doc.url)==child
              report("TACTING",requests=client.requests-before,publisher_inventory_match=True,title=role,
                     form=form,same_title=match,route="same-page" if apply else "published-child" if child else "no-observed-form")
          except Exception as exc:
              report("TACTING",requests=client.requests-before,error=str(getattr(exc,"reason",exc))[:150])
          
          report("FOLLOWUP_COST",requests=client.requests,bytes=client.bytes,seconds=round(time.monotonic()-start,3),
                 catalog_writes=0)
          PY
