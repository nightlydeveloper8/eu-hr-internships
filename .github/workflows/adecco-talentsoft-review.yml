name: Review observed Danone iCIMS routes
on:
  push:
    branches: ['pilot/adecco-talentsoft-20261120']
    paths: ['.github/workflows/adecco-talentsoft-review.yml']
permissions:
  contents: read
jobs:
  review:
    if: github.event.head_commit.message == 'Review two observed Danone iCIMS application routes'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python - <<'PY'
          import json
          import re
          import time
          from urllib.parse import urljoin
          
          from collector.applications import checked_document
          from collector.ats_channel_discovery import safe_url
          from collector.classify import canonical_url, fold
          from collector.pipeline import ROOT, read
          from collector.runtime import BudgetClient
          from collector.verification import applicant_form, same_title
          
          wanted={"fc0802251335577ff651":"enapply-danone.icims.com","714f47bbc72420b610a8":"esapply-danone.icims.com"}
          jobs=read(ROOT/"data/catalog.json",{})["jobs"]
          rows=[j for j in jobs if j["id"] in wanted and j.get("source_id")=="employer-danone" and not j.get("ownership_risk")]
          assert len(rows)==len(wanted)
          started=time.monotonic()
          allowed=set()
          
          class ExactReads(BudgetClient):
              def request(self,url,method="GET",**kwargs):
                  if method!="GET" or not self.redirect_scope_allowed(url):
                      raise ValueError("URL outside exact pilot scope")
                  return super().request(url,method=method,**kwargs)
          
          client=ExactReads(seconds=60,max_requests=10,delay=1)
          client.redirect_scope_allowed=lambda url:bool(safe_url(url) and canonical_url(url) in allowed)
          def read_document(url):
              parsed=safe_url(url)
              allowed.update({canonical_url(url),f"https://{parsed.hostname}/robots.txt"})
              return checked_document(url,dict(allowed_hosts=[parsed.hostname]),client)
          
          positive=0
          for row in rows:
              allowed.clear()
              before=client.requests
              host=wanted[row["id"]]
              result=dict(id=row["id"],country=row["country"],ats=host)
              try:
                  assert safe_url(row["url"]).hostname=="careers.danone.com"
                  _,posting=read_document(row["url"])
                  assert same_title(posting,row["title"])
                  targets=set()
                  for href,label,_ in posting.links:
                      url=urljoin(posting.url,href)
                      parsed=safe_url(url)
                      if parsed and parsed.hostname==host and re.search(r"\b(?:apply|postuler|candidat\w+|solicitar|inscrib\w+)\b",fold(label)):
                          targets.add(canonical_url(url))
                  result["observed_ctas"]=len(targets)
                  if len(targets)!=1:
                      raise ValueError("One observed, employer-published iCIMS CTA is required")
                  url=targets.pop()
                  parsed=safe_url(url)
                  result["cta_path"]=parsed.path
                  number=re.match(r"/jobs/(\d+)(?:/|$)",parsed.path)
                  if not number:
                      raise ValueError("The observed CTA did not carry a specific iCIMS posting ID")
                  if re.search(r"/(?:login|sign-in|signin|register)(?:/|$)",parsed.path,re.I):
                      raise ValueError("The application CTA already targets account authentication")
                  body,page=read_document(url)
                  same=same_title(page,row["title"]) and canonical_url(page.url)==url
                  form=applicant_form(body,strict=True)
                  result.update(same_title_and_url=same,strict_form=form,ats_posting_id=number[1],
                                state="confirmed" if same and form else "review-required")
                  positive+=bool(same and form)
              except Exception as exc:
                  result.update(state="review-required",reason=str(getattr(exc,"reason",exc))[:170])
              print("DANONE_RESULT "+json.dumps(dict(result,requests=client.requests-before),ensure_ascii=False),flush=True)
          print("DANONE_COST "+json.dumps(dict(requests=client.requests,bytes=client.bytes,
                seconds=round(time.monotonic()-started,3),positive=positive,catalog_writes=0)),flush=True)
          PY
