name: Check public site and Teamtailor inventory
on:
  push:
    branches: ['pilot/adecco-talentsoft-20261120']
    paths: ['.github/workflows/adecco-talentsoft-review.yml']
permissions:
  contents: read
jobs:
  review:
    if: github.event.head_commit.message == 'Check Cloudflare with a descriptive client and review Tacting inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          import re
          import time
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          
          from collector.applications import checked_document
          from collector.ats_channel_discovery import safe_url
          from collector.classify import canonical_url, classify_role
          from collector.pipeline import ROOT
          from collector.runtime import BudgetClient
          from collector.verification import applicant_form, same_title
          
          def report(label, **values):
              print(label+" "+json.dumps(values,ensure_ascii=False),flush=True)
          
          base="https://people-placement-eu.pages.dev/"
          headers={"User-Agent":"PeoplePlacement-DeploymentCheck/1.0 (+https://github.com/nightlydeveloper8/eu-hr-internships)"}
          for path in ("","data/catalog.json"):
              try:
                  with urlopen(Request(base+path,headers=headers),timeout=12) as r:
                      url,status,body=r.geturl(),r.status,r.read()
                  result=dict(status=status,url=url)
                  if path:
                      data=json.loads(body)
                      result.update(rows=len(data["jobs"]),timestamp=data["last_attempt_at"],
                                    matches_main=sha256(body).digest()==sha256((ROOT/path).read_bytes()).digest())
                  else:
                      result.update(page_matches=b"People Placement" in body)
                  report("VERIFIED_SITE",**result)
              except Exception as exc:
                  report("VERIFIED_SITE",path=path,error=str(exc)[:160])
          
          started=time.monotonic()
          host="tacting.teamtailor.com"
          board=f"https://{host}/jobs"
          allowed={board,f"https://{host}/robots.txt"}
          
          class BoardReads(BudgetClient):
              def request(self,url,method="GET",**kwargs):
                  if method!="GET" or not self.redirect_scope_allowed(url):
                      raise ValueError("Outside exact URL list")
                  return super().request(url,method=method,**kwargs)
          
          client=BoardReads(seconds=35,max_requests=7,delay=1)
          client.redirect_scope_allowed=lambda url:bool(safe_url(url) and canonical_url(url) in allowed)
          source=dict(allowed_hosts=[host])
          try:
              _, inventory=checked_document(board,source,client)
              def from_links(document,pattern):
                  found=set()
                  for href,_,_ in document.links:
                      target=urljoin(document.url,href)
                      parsed=safe_url(target)
                      if parsed and parsed.hostname==host and re.fullmatch(pattern,parsed.path.rstrip("/")):
                          found.add(canonical_url(target))
                  return found
              posts=from_links(inventory,r"/jobs/8621469(?:-[^/]+)?")
              if len(posts)!=1:
                  raise ValueError("The current official board did not list posting 8621469 once")
              url=posts.pop()
              allowed.add(url)
              body,page=checked_document(url,source,client)
              titles=[t for t in page.h1 if classify_role(t) and classify_role(t)["internship_type"]=="internship"]
              assert len(set(titles))==1 and canonical_url(page.url)==url
              title=titles[0]
              form=applicant_form(body,strict=True)
              matched=same_title(page,title)
              route="same-page" if form else "missing"
              if not form:
                  children=from_links(page,re.escape(safe_url(url).path.rstrip("/"))+r"/applications/new")
                  if len(children)==1:
                      child=children.pop()
                      allowed.add(child)
                      body,application=checked_document(child,source,client)
                      form=applicant_form(body,strict=True)
                      matched=same_title(application,title) and canonical_url(application.url)==child
                      route="published-child"
              report("BOARD_RESULT",listing=8621469,title=title,posting=url,published_route=route,
                     rigorous_form=form,exact_title=matched)
          except Exception as exc:
              report("BOARD_RESULT",state="review-required",reason=str(getattr(exc,"reason",exc))[:200])
          report("BOARD_COST",requests=client.requests,bytes=client.bytes,seconds=round(time.monotonic()-started,3))
          PY
