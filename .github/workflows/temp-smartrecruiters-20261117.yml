name: TEMP SmartRecruiters public same-ID pilot (remove after)
on:
  push:
    branches: [pilot/smartrecruiters-sameid-20261117]
    paths:
      - .github/workflows/temp-smartrecruiters-20261117.yml
permissions:
  contents: read
jobs:
  bounded-read:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Offline regressions
        run: python -m unittest discover -s tests -p test_pilot_smartrecruiters_public.py -v
      - name: Allowed-host read-only catalog sample (12 max, 90 sec, 30 HTTP max)
        run: |
          python -m scripts.pilot_smartrecruiters_public --output smartrecruiters-public-20261117.json
      - uses: actions/upload-artifact@v4
        with:
          name: smartrecruiters-readonly-result
          path: smartrecruiters-public-20261117.json
          retention-days: 3
