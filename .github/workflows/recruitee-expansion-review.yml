name: Check Recruitee rollout offline
on:
  push:
    branches: ['stage/recruitee-expansion-20261120']
    paths: ['.github/workflows/recruitee-expansion-review.yml']
permissions:
  contents: read
jobs:
  review:
    if: github.event.head_commit.message == 'Validate exact four-source activation offline'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m unittest discover -s tests -p 'test_recruitee*.py' -q
          python -m unittest discover -s tests -p 'test_ampelmann_disabled_provision.py' -q
          python - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          import json
          
          from collector.company_registry import validate_registry
          from collector.daily import provision
          from collector.pipeline import ROOT,read
          
          names={"recruitee-ampelmann-nl","recruitee-batch-vigo-groep","recruitee-batch-chr-haute-senne","recruitee-batch-abrio"}
          companies=read(ROOT/"data/companies.json",[])
          sources=read(ROOT/"data/sources.json",[])
          geo=read(ROOT/"data/geography.json",{})
          active=lambda rows:{r["id"] for r in rows if r.get("enabled")}
          proposed=[s for s in sources if s["id"] in names]
          cids={s["company_id"] for s in proposed}
          held=[c for c in companies if c["id"] in cids]
          assert len(proposed)==len(held)==4
          assert all(s.get("enabled") is False and len(s["allowed_hosts"])==1
                     and s.get("application_check")=="recruitee-linked"
                     and (s.get("report_feed_scope") is True or s.get("feed_format")=="recruitee-public-xml")
                     for s in proposed)
          assert all(c.get("collection_activation_hold") is True for c in held)
          assert validate_registry(companies,geo,sources)
          base=active(sources)
          pc,ps=provision(companies,sources)
          assert active(ps)==base and len(ps)==len(sources) and len(pc)==len(companies)
          assert provision(pc,ps)==(pc,ps)
          sim_c,sim_s=deepcopy(companies),deepcopy(sources)
          for source in sim_s:
              if source["id"] in names:
                  source["enabled"]=True
          for company in sim_c:
              if company["id"] in cids:
                  company.pop("collection_activation_hold")
          sc,ss=provision(sim_c,sim_s)
          assert active(ss)-base==names and not base-active(ss)
          assert len(ss)==len(sources) and len(sc)==len(companies)
          assert provision(sc,ss)==(sc,ss)
          assert validate_registry(sc,geo,ss)
          print("ACTIVATION_SIMULATION "+json.dumps(dict(configured=len(sources),current=len(base),
              simulated=len(active(ss)),new=sorted(active(ss)-base),provisioned_automatically=0,
              registry_writes=0,catalog_writes=0)),flush=True)
          PY
          git diff --exit-code
