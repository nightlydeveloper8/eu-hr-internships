name: Check remaining independent official routes
on:
  push:
    branches: ['stage/recruitee-expansion-20261120']
    paths: ['.github/workflows/recruitee-expansion-review.yml']
permissions:
  contents: read
jobs:
  review:
    if: github.event.head_commit.message == 'Verify alternate official routes and the disabled registry'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from hashlib import sha256
          import json
          from pathlib import Path
          import re
          from tempfile import TemporaryDirectory
          from time import monotonic
          from urllib.parse import urljoin
          
          from collector.ats_channel_discovery import safe_url
          from collector.classify import canonical_url
          from collector.daily import provision
          from collector.pipeline import ROOT, finalize, now, process_source, read
          from collector.runtime import BudgetClient
          from collector.universal import Document
          from collector.verification import verified_job
          
          candidates=[
              ("life-outdoor-living","Life Outdoor Living International B.V.","NL","lifeoutdoorliving.recruitee.com","https://www.werkenbijlifeoutdoorliving.com/vacature/"),
              ("deerns","Deerns Groep BV","NL","jobsdeerns.recruitee.com","https://www.deerns.com/nl/carriere/"),
              ("vigo-groep","VIGO groep","NL","werkenbijvigogroep.recruitee.com","https://www.vigogroep.nl/"),
              ("chr-haute-senne","CHR HAUTE SENNE","BE","chrhautesenne.recruitee.com","https://www.chrhautesenne.be/fr/emplois-et-stages"),
              ("abrio","ABRIO GmbH","DE","abriogmbh.recruitee.com","https://www.abrio.de/pages/alle-jobs"),
          ]
          registry=read(ROOT/"data/sources.json",[])
          companies=read(ROOT/"data/companies.json",[])
          _, provisioned=provision(companies,registry)
          assert {s['id'] for s in provisioned if s.get('enabled')}=={s['id'] for s in registry if s.get('enabled')}
          amp=next(s for s in registry if s['id']=='recruitee-ampelmann-nl')
          assert not amp["enabled"] and amp["allowed_hosts"]==["careers.ampelmann.nl"]
          stamp=now()
          prior=read(ROOT/"data/catalog.json",{})
          prior_report=read(ROOT/"data/coverage.json",{})
          baseline={j['id'] for j in prior['jobs']}
          original=sha256((ROOT/"data/catalog.json").read_bytes()).hexdigest()
          
          class Scoped(BudgetClient):
              def request(self,url,method="GET",**kwargs):
                  if method!="GET" or not self.redirect_scope_allowed(url):
                      raise ValueError("Outside read-only pilot scope")
                  return super().request(url,method=method,**kwargs)
          
          def check(item):
              key,name,cc,host,origin=item
              client=Scoped(seconds=55,max_requests=14,delay=0.8)
              started=monotonic()
              def allowed(url):
                  p=safe_url(url)
                  if not p:
                      return False
                  if origin and p.hostname==safe_url(origin).hostname:
                      return canonical_url(url)==canonical_url(origin) or (p.path=="/robots.txt" and not p.query)
                  if p.hostname!=host:
                      return False
                  return p.path in {"/api/offers/","/api/offers","/api/feeds/offers.xml","/robots.txt"} or bool(
                      re.fullmatch(r"/(?:l/[a-z]{2}(?:-[a-z]+)?/)?o/[a-zA-Z0-9%_-]+(?:/c/new)?/?",p.path))
              client.redirect_scope_allowed=allowed
              source=dict(id="recruitee-batch-"+key,company_id="recruitee-batch-"+key,employer=name,
                  adapter="recruitee",enabled=False,allowed_hosts=[host],target_countries=[cc],
                  feed_url=f"https://{host}/api/offers/",application_check="recruitee-linked",
                  career_url=origin,permission_basis="Employer-published and reviewed public recruiting link",
                  ownership_scope="reviewed-hosts",require_employer_identity=True,max_requests=14,collection_seconds=55)
              row=dict(key=key,company=name,country=cc,host=host,origin=origin)
              part=None
              try:
                  if key=="ampelmann":
                      source=amp
                  else:
                      body,_,final=client.request(origin)
                      page=Document(body,final)
                      assert any(safe_url(urljoin(final,h)) and safe_url(urljoin(final,h)).hostname==host
                                 for h,_,_ in page.links), "Official page did not expose exact tenant"
                  part=process_source(source,client,stamp)
                  assert not source["enabled"]
                  report=part["report"]
                  verified=[{k:j.get(k) for k in ("id","external_id","title","city","country","url","apply_url")}
                            for j in part["jobs"]
                            if j.get("country")==cc and j.get("internship_type")=="internship"
                            and verified_job(j,stamp) and j.get("application_verification")]
                  row.update(status=report.get("status"),matching=report.get("matching"),records=report.get("collected"),
                             verified=verified,error=report.get("error"),page_errors=report.get("page_errors",[])[:3])
              except Exception as exc:
                  row.update(status="incomplete",error=str(getattr(exc,"reason",exc))[:180],verified=[])
              row.update(requests=client.requests,bytes=client.bytes,seconds=round(monotonic()-started,3))
              return source,part,row
          
          
          # Deerns' documented employer-page link establishes the exact tenant.
          # The corporate origin returned 403 in the first runner, so it is not requested again.
          def deerns():
              return check(("deerns","Deerns Groep BV","NL","jobsdeerns.recruitee.com",None))
          
          def life_hosts():
              client=Scoped(seconds=25,max_requests=3,delay=0.8)
              host="lifeoutdoorliving.recruitee.com"
              client.redirect_scope_allowed=lambda url:bool(safe_url(url) and safe_url(url).hostname==host
                  and safe_url(url).path in {"/api/offers/","/api/offers","/robots.txt"})
              result={}
              try:
                  data=client.json(f"https://{host}/api/offers/")
                  published=[record for record in data.get("offers",[]) if record.get("status")=="published"]
                  result.update(rows=len(published),vacancy_hosts=sorted({safe_url(j.get("careers_url")).hostname
                      for j in published if safe_url(j.get("careers_url"))}),
                      candidate_hosts=sorted({safe_url(j.get("careers_url")).hostname
                      for j in published if safe_url(j.get("careers_url")) and
                      "/hr-stagiaire-2027" in safe_url(j.get("careers_url")).path}))
              except Exception as exc:
                  result["error"]=str(getattr(exc,"reason",exc))[:160]
              return dict(result,requests=client.requests,bytes=client.bytes)
          
          def direct_check(key,name,index,posting,entry=None):
              host=safe_url(index).hostname
              client=Scoped(seconds=40,max_requests=8,delay=0.8)
              urls={canonical_url(u) for u in (index,posting,f"https://{host}/robots.txt",entry) if u}
              client.redirect_scope_allowed=lambda url:bool(safe_url(url) and canonical_url(url) in urls)
              source=dict(id="employer-review-"+key,company_id="employer-review-"+key,employer=name,
                  adapter="employer-index",enabled=False,allowed_hosts=[host],target_countries=["NL"],
                  start_urls=[index],index_urls=[index],career_url=index,job_url_pattern="^"+re.escape(posting)+"$",
                  permission_basis="Official employer index and same-posting application",
                  ownership_scope="reviewed-hosts",require_employer_identity=True,
                  report_index_scope=True,inventory_scope_complete=False,max_requests=8,collection_seconds=40)
              result=dict(key=key,source=source)
              try:
                  p=process_source(source,client,stamp)
                  result.update(report={k:p["report"].get(k) for k in ("status","collected","matching","error","page_errors")},
                      verified=[{k:j.get(k) for k in ("id","title","city","country","url","apply_url")}
                          for j in p["jobs"] if verified_job(j,stamp) and j.get("application_verification")
                          and j.get("internship_type")=="internship" and j.get("country")=="NL"])
              except Exception as exc:
                  result["error"]=str(getattr(exc,"reason",exc))[:160]
              return dict(result,requests=client.requests,bytes=client.bytes)
          
          with ThreadPoolExecutor(max_workers=3) as pool:
              ds=pool.submit(deerns)
              lf=pool.submit(life_hosts)
              dnz=pool.submit(direct_check,"de-nieuwe-zaak","De Nieuwe Zaak","https://www.denieuwezaak.nl/vacatures",
                  "https://www.denieuwezaak.nl/vacatures/hr-meewerkstage")
              good=pool.submit(direct_check,"gooddays","GoodDays","https://www.gooddays.nl/vacatures",
                  "https://www.gooddays.nl/vacatures/stage-hr-recruitment-personeelsplanning","https://www.gooddays.nl/solliciteer?jobID=469158")
              results={"deerns":ds.result()[2],"life":lf.result(),"de-nieuwe-zaak":dnz.result(),"gooddays":good.result()}
          for key,row in results.items():
              print("FOLLOWUP "+json.dumps(dict(name=key,**row),ensure_ascii=False),flush=True)
          assert sha256((ROOT/"data/catalog.json").read_bytes()).hexdigest()==original
          print("REGISTRY_HOLD "+json.dumps(dict(enabled=sum(bool(s.get("enabled")) for s in registry),
              held=[s["id"] for s in registry if s["id"].startswith("recruitee-batch-") or s["id"]=="recruitee-ampelmann-nl"],
              catalog_unchanged=True)),flush=True)
          PY
