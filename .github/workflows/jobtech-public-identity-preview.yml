name: Jobandtalent existing-ID preview through latest finalize
on:
  push:
    branches: ['pilot/jobtech-preserve-public-id-20261119']
    paths: ['.github/workflows/jobtech-public-identity-preview.yml']
permissions:
  contents: read
jobs:
  proof:
    if: github.event.head_commit.message == 'Stage Jobandtalent on its existing public listing identity'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          path: reviewed
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '3f20f511092d7cd5cb12aa3428bf8b4edc0ca3e6'
          path: current
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify positive and fail-closed staging cases offline
        working-directory: reviewed
        run: |
          python -m unittest discover -s tests -p 'test_official_feed_staging.py' -v
          python -m unittest discover -s tests -p 'test_jobtech_daily_adapter.py' -v
      - name: Re-read a single exact JobTech ID and employer form
        working-directory: reviewed
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from urllib.parse import urlsplit
          from collector.official_feed_adapter import AtsBudgetFactory, source_gate
          from collector.official_feed_discovery import JOBTECH_HOST, jobtech_candidate
          from collector.official_feed_policy_dossier import review
          from collector.official_feed_staging import staging_part
          from collector.pipeline import ROOT, now, read
          from collector.runtime import BudgetClient

          start = time.monotonic()
          registry = read(ROOT / 'data/sources.json',[])
          source = next(s for s in registry if s['id']=='staging-jobandtalent-se')
          source_gate(source,preview=True)
          assert source['enabled'] is False
          rows=read(Path('../current/data/catalog.json'),{})['jobs']
          client=BudgetClient(seconds=25,max_requests=3,delay=1)
          client.redirect_scope_allowed=lambda url: urlsplit(url).scheme=='https' and urlsplit(url).hostname==JOBTECH_HOST
          payload=client.json('https://'+JOBTECH_HOST+'/ad/'+source['provider_id'])
          assert str(payload['id'])==source['provider_id']
          candidate=jobtech_candidate(payload)
          assert candidate and candidate['provider_id']==source['provider_id']
          factory=AtsBudgetFactory(client,10,45)
          dossier=review(candidate,approved_host=source['allowed_hosts'][0],approved_inventory_url=source['reviewed_inventory_url'],client_factory=factory)
          stamp=now()
          part=staging_part(candidate,dossier,source,stamp,prior_jobs=rows,production=False)
          print('LIVE '+json.dumps(dict(proof=dossier['status'],reason=part['report'].get('reason'),stage_rows=len(part['jobs']),
              feed_requests=client.requests,ats_requests=factory.requests,bytes=client.bytes+factory.bytes,seconds=round(time.monotonic()-start,3))),flush=True)
          assert len(part['jobs'])==1, part['report'].get('reason')
          assert part['jobs'][0]['id']=='c8bdac2ae98420d4b1e7'
          repeat=staging_part(candidate,dossier,source,stamp,prior_jobs=[part['jobs'][0]],production=False)
          assert repeat['jobs']==part['jobs']
          Path('../staged.json').write_text(json.dumps(dict(source=source,part=part,stamp=stamp)))
          PY
      - name: Use latest main finalizer in a temporary directory
        working-directory: current
        run: |
          python - <<'PY'
          from copy import deepcopy
          from datetime import datetime, timedelta
          from tempfile import TemporaryDirectory
          import json
          import hashlib
          from pathlib import Path
          from collector.pipeline import finalize, read

          staged=json.loads(Path('../staged.json').read_text())
          source,part,stamp=(staged[k] for k in ('source','part','stamp'))
          catalog=Path('data/catalog.json')
          original=hashlib.sha256(catalog.read_bytes()).hexdigest()
          before=read(catalog,{})
          coverage=read(Path('data/coverage.json'),{})
          registry=read(Path('data/sources.json'),[])+[source]
          identity='c8bdac2ae98420d4b1e7'
          previous=next(j for j in before['jobs'] if j['id']==identity)
          def confirmation_count(data):
              return sum(j.get('status')=='open' and bool(j.get('application_verification')) for j in data['jobs'])
          with TemporaryDirectory() as path:
              out,report=finalize(registry,[source],deepcopy(before),deepcopy(coverage),[deepcopy(part)],stamp,Path(path))
              out2,_=finalize(registry,[source],deepcopy(out),deepcopy(report),[deepcopy(part)],stamp,Path(path))
              public=next(s for s in registry if s['id']=='public-se-jobtech')
              later=(datetime.fromisoformat(stamp)+timedelta(seconds=1)).isoformat()
              listing=deepcopy(previous)
              listing.update(last_seen_at=later,last_verified_at=later)
              listing['verification']['checked_at']=later
              public_part=dict(report=dict(id=public['id'],status='partial',records_inspected=1),jobs=[listing],closure_eligible=[])
              shared,_=finalize(registry,[source,public],deepcopy(before),deepcopy(coverage),[deepcopy(part),public_part],later,Path(path))
          original_ids={j['id'] for j in before['jobs']}
          row=next(j for j in out['jobs'] if j['id']==identity)
          repeated=next(j for j in out2['jobs'] if j['id']==identity)
          concurrent=next(j for j in shared['jobs'] if j['id']==identity)
          assert {j['id'] for j in out['jobs']}==original_ids=={j['id'] for j in out2['jobs']}
          assert {j['id'] for j in shared['jobs']}==original_ids
          assert row['first_discovered_at']==previous['first_discovered_at'] and previous['url'] in row['public_listing_urls']
          assert row['application_verification']==repeated['application_verification']
          assert row['public_listing_urls']==repeated['public_listing_urls']
          assert hashlib.sha256(catalog.read_bytes()).hexdigest()==original
          assert confirmation_count(out)==confirmation_count(before)+1
          print('FINALIZE '+json.dumps(dict(id=identity,ids_before=len(original_ids),ids_after=len(out['jobs']),
              confirmed_before=confirmation_count(before),confirmed_after=confirmation_count(out),
              public_link_preserved=True,idempotent=True,ordinary_public_refresh_still_has_application=bool(concurrent.get('application_verification')),
              activation=source['enabled'],closure_eligible=part['closure_eligible'])),flush=True)
          PY
