name: Verify fresh Jobandtalent proof against later public refresh
on:
  push:
    branches: ['pilot/jobtech-preserve-public-id-20261119']
    paths: ['.github/workflows/jobtech-public-identity-preview.yml']
permissions:
  contents: read
jobs:
  proof:
    if: github.event.head_commit.message == 'Protect exact fresh application evidence from public-only refreshes'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          path: reviewed
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '3f20f511092d7cd5cb12aa3428bf8b4edc0ca3e6'
          path: current
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the patched adapter and evidence ordering offline
        working-directory: reviewed
        run: |
          python -m unittest discover -s tests -p 'test_official_feed_staging.py' -v
          python -m unittest discover -s tests -p 'test_jobtech_daily_adapter.py' -v
          git diff HEAD^ HEAD -- collector/pipeline.py | git -C ../current apply -
      - name: Replay the exact public identity, later refresh and expiry on current main
        working-directory: current
        run: |
          python - <<'PY'
          from copy import deepcopy
          from datetime import datetime,timedelta
          from tempfile import TemporaryDirectory
          from pathlib import Path
          import json
          from collector.pipeline import finalize,read

          source='staging-jobandtalent-se'
          cat=read(Path('data/catalog.json'),{})
          cov=read(Path('data/coverage.json'),{})
          st=cat['updated_at']
          previous=next(j for j in cat['jobs'] if j['id']=='c8bdac2ae98420d4b1e7')
          ats_url=previous['external_application_url']
          employer=dict(previous,source_id=source,source_type='jobtech-policy-v2-staging',
              external_id='8503489',source_posting_id='8503489',url=ats_url.split('/applications/new',1)[0],
              apply_url=ats_url,status='open',last_seen_at=st,last_verified_at=st,
              public_listing_urls=sorted({previous['url'],*previous.get('public_listing_urls',[])}),
              verification=dict(policy_version=2,state='verified',checked_at=st),
              application_verification=dict(url=ats_url,method='synthetic-regression-proof',checked_at=st),
              official_feed_provenance=dict(provider='jobtech-se',public_id='31558200',ats_id='8503489'))
          later=(datetime.fromisoformat(st)+timedelta(hours=1)).isoformat()
          expired=(datetime.fromisoformat(st)+timedelta(hours=49)).isoformat()
          registry=read(Path('data/sources.json'),[])+[dict(id=source,adapter='jobtech-policy-v2',enabled=False)]
          def part(job):
              return dict(jobs=[job],report=dict(id=job['source_id'],status='partial',records_inspected=1),closure_eligible=[])
          def public(t,**other):
              return dict(previous,last_seen_at=t,last_verified_at=t,verification=dict(previous['verification'],checked_at=t),**other)
          def finish(prior,observed,t,tmp):
              return finalize(registry,[{} for j in observed],deepcopy(prior),deepcopy(cov),
                              [part(deepcopy(j)) for j in observed],t,Path(tmp))[0]
          def get(doc):
              return next(j for j in doc['jobs'] if j['id']==previous['id'])
          with TemporaryDirectory() as tmp:
              first=finish(cat,[employer,public(later)],later,tmp)
              second=finish(first,[public(later)],later,tmp)
              fallback=finish(second,[public(expired)],expired,tmp)
              changed=finish(first,[public(later,external_application_url=None)],later,tmp)
          for doc in (first,second):
              j=get(doc)
              assert j['application_verification']==employer['application_verification']
              assert j['last_verified_at']==st and previous['url'] in j['public_listing_urls']
          assert {j['id'] for j in first['jobs']}=={j['id'] for j in cat['jobs']}
          assert not get(fallback).get('application_verification')
          assert get(fallback)['verification']['policy']=='public-api-active-listing'
          assert not get(changed).get('application_verification')
          print('ORDERING '+json.dumps(dict(same_cycle=True,next_public_refresh=True,
                expired_downgrades=True,changed_link_downgrades=True,id_preserved=True,network_requests=0)),flush=True)
          PY
